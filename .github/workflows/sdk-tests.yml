name: Bitmap SDK tests
on:
  push:
    branches:
      - main
      - feature/shared-bitmap-block-index-20261019
  pull_request:
jobs:
  indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test read-only Bitmap indexing
        run: node --test tests/*.test.mjs
